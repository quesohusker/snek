name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r packaging/requirements.lock
      - run: pip install --no-deps .
      - run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$(python -c 'import sys; sys.path.insert(0, "packaging"); import build; print(build.executable())')"
      - run: pip freeze > packaging/dist/Snek-${{ matrix.os }}-python-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.os }}
          path: packaging/dist/Snek-*
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: |
          mkdir -p stage
          git archive --format=tar --prefix=snek/ HEAD | tar -x -C stage
          cp -R frontend/dist stage/snek/frontend/dist
          rm -rf stage/snek/.claude
          (cd stage && zip -q -r -X ../snek.zip snek)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: snek.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Snek ${GITHUB_REF_NAME#v}" --notes "Download instructions are in the README."
          gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
