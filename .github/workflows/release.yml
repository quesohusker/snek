name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller pillow
      - run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py "$(python -c 'import sys; sys.path.insert(0, "packaging"); import build; print(build.executable())')"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: packaging/dist/Snek-*
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          mkdir -p stage
          git archive --format=tar --prefix=snek/ HEAD | tar -x -C stage
          cp -R frontend/dist stage/snek/frontend/dist
          rm -rf stage/snek/.claude
          (cd stage && zip -q -r -X ../snek.zip snek)
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: snek.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Snek ${GITHUB_REF_NAME#v}" --notes "Download instructions are in the README."
          gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
